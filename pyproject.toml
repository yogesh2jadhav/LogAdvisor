[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready-log-advisor"
version = "0.1.0"
description = "Local-LLM AI-Ready Logging Advisor for Java + Apache Spark codebases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "tree-sitter>=0.21",
    "tree-sitter-java>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# tree-sitter is a core dependency now; this extra is kept as a no-op alias
# for anyone who pinned `pip install ai-ready-log-advisor[treesitter]`.
treesitter = []

[project.scripts]
java-log-advisor = "logadvisor.cli:main"
logadvisor = "logadvisor.cli:main"

[tool.setuptools]
packages = [
    "logadvisor",
    "logadvisor.scanner",
    "logadvisor.rules",
    "logadvisor.llm",
    "logadvisor.db",
    "logadvisor.report",
]

[tool.setuptools.package-data]
"logadvisor.rules" = ["*.yaml"]
"logadvisor.db" = ["migrations/*.sql"]
"logadvisor.report" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
